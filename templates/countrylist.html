<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Countries and Capitals</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f6fc;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #075985;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #075985;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f6fc;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #075985;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Countries and Capitals</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Country</th>
                <th>Capital</th>
            </tr>
        </thead>

        <tbody>
            {% for country in countries %}
                <tr>
                    <td>{{ country.id }}</td>

                    <td>{{ country.countryname }}</td>

                    <td>
                        {{ country.capital.capitalname }}
                    </td>
                </tr>

            {% empty %}
                <tr>
                    <td colspan="3">
                        No countries found.
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="{% url 'insertcountry' %}">
        Add Another Country
    </a>

</div>

</body>
</html>
